{% extends 'base.html' %}

{% block conteudo %}

<h1>Cadastrar Receita</h1>

{% if erro %}

<div class="alert alert-danger">
    {{ erro }}
</div>

{% endif %}

<form method="POST">

    <div class="mb-3">
        <label>Descrição</label>
        <input type="text"
               class="form-control"
               name="descricao"
               required>
    </div>

    <div class="mb-3">
        <label>Valor</label>
        <input type="number"
               step="0.01"
               min="0.01"
               class="form-control"
               name="valor"
               required>
    </div>

    <div class="mb-3">
        <label>Data</label>
        <input type="date"
               class="form-control"
               name="data"
               required>
    </div>

    <div class="mb-3">
        <label>Categoria</label>

        <select name="categoria" class="form-control">

            {% for categoria in categorias %}

            <option value="{{ categoria['id_categoria'] }}">
                {{ categoria['nome_categoria'] }}
            </option>

            {% endfor %}

        </select>

    </div>

    <button class="btn btn-success">
        Salvar Receita
    </button>

</form>

{% endblock %}
